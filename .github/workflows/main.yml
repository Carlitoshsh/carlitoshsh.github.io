name: Deploy Next.js to Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies 🔧
        run: npm ci # Faster and more reliable than 'npm install' for CI

      - name: Build Next.js 🏗️
        run: npm run build

      - name: Disable Jekyll 🚫
        # This is the magic fix for Next.js 404s on GitHub Pages
        run: touch out/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
